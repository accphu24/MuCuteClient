name: Build MuCuteClient (full pipeline)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MuCuteRelay
        uses: actions/checkout@v4
        with:
          repository: accphu24/MuCuteRelay
          path: MuCuteRelay
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build uberJar
        working-directory: MuCuteRelay
        run: |
          chmod +x gradlew
          ./gradlew uberJar
      - uses: actions/upload-artifact@v4
        with:
          name: MuCuteRelay-jar
          path: MuCuteRelay/build/libs/MuCuteRelay.jar

  build-client:
    needs: build-relay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MuCuteClient
        uses: actions/checkout@v4
        with:
          path: MuCuteClient
      - name: Download MuCuteRelay.jar artifact
        uses: actions/download-artifact@v4
        with:
          name: MuCuteRelay-jar
          path: MuCuteClient/app/libs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant execute permission for gradlew
        working-directory: MuCuteClient
        run: chmod +x gradlew
      - name: Assemble debug APK
        working-directory: MuCuteClient
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MuCuteClient-apk
          path: MuCuteClient/app/build/outputs/apk/debug/*.apk
